[package]
name = "apdo-hardware"
version.workspace = true
edition.workspace = true
license = "MIT"
[features]
time = ["dep:embassy-time", "dep:embassy-time-driver", "dep:embassy-time-queue-utils", "dep:embassy-sync"]
[dependencies]
cortex-m = "0.7.10"
critical-section = "1.2.0"
thiserror = {version = "2.0.21", default-features = false}
embassy-time-driver = {version = "0.2.2", optional = true}
embassy-time-queue-utils = {version = "0.3.2", optional = true, features = ["generic-queue-16"]}
embassy-sync = {version = "0.8.0", optional = true}
embassy-time = {version = "0.5.1", optional = true, features = ["tick-hz-32_768"]}
[dev-dependencies]
critical-section = {version = "1.2.0", features = ["std"]}
