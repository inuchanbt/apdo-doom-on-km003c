[package]
name = "apdo-firmware"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-or-later"
[dependencies]
apdo-hardware = {path = "../hardware", features = ["time"]}
apdo-protocol = {path = "../protocol"}
cortex-m = {version = "0.7.10", features = ["critical-section-single-core"]}
cortex-m-rt = {version = "0.7.7", features = ["device"]}
embassy-executor = {version = "0.10.0", features = ["platform-cortex-m", "executor-thread"]}
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = {version = "0.5.1", features = ["tick-hz-32_768"]}
embassy-usb = "0.6.0"
embassy-usb-synopsys-otg = {git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02"}
static_cell = "2.1.1"
