[package]
name = "km003c-backup"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
km003c-lib = { git = "https://github.com/okhsunrog/km003c-rs", rev = "efed50556d7376914bffd510e012aaa98081936f", version = "0.4.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
crc32fast = "1.5.3"
tempfile = "3.27.0"
